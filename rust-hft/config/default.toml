# HFT Server Default Configuration

[server]
host = "127.0.0.1"
port = 8080

[polymarket]
ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
rest_url = "https://clob.polymarket.com"
chain_id = 137

[arbitrage]
# Minimum spread in basis points (100 bps = 1%)
min_spread_bps = 30
# Maximum position size per trade in USD
max_position_size_usd = 500.0
# Cooldown between trades on same market (milliseconds)
cooldown_ms = 100

[risk]
# Maximum total exposure in USD
max_total_exposure_usd = 5000.0
# Maximum daily loss before circuit breaker trips (USD)
max_daily_loss_usd = 500.0
# Maximum number of simultaneous positions
max_positions = 10

[metrics]
# Prometheus metrics port
prometheus_port = 9090
# Log level: trace, debug, info, warn, error
log_level = "info"
# Use JSON format for logs
json_logs = false
