[project]
name = "polymarket-bot"
version = "0.1.0"
description = "A Polymarket trading bot using news sentiment analysis"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # Polymarket
    "py-clob-client>=0.34.0",

    # LLM (Gemini 2.5 Flash)
    "google-genai>=1.0.0",

    # Vector DB & Embeddings
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",

    # News APIs
    "newsapi-python>=0.2.7",
    "httpx>=0.27.0",

    # Data handling
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Async
    "aiohttp>=3.9.0",

    # Utils
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "structlog>=24.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
polymarket-bot = "src.main:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
