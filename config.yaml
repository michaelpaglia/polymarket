# Trading mode
paper_trading: false  # Live trading mode

# News sources
news:
  poll_interval_seconds: 60
  sources:
    - newsapi
    - gnews
    - grok  # X/Twitter via Grok API for real-time social media news
  # NO hardcoded keywords - we fetch broad news and use LLM to match
  # against active Polymarket markets dynamically

# Market matching
markets:
  refresh_interval_minutes: 15
  min_liquidity_usd: 500  # Minimum liquidity to filter low-volume markets
  max_days_to_resolution: 3  # Only markets ending within 3 days
  top_k_matches: 2  # Reduced from 5 to save API costs

# Signal generation
signals:
  llm_provider: "google"
  model: "gemini-3-flash-preview"
  confidence_threshold: 0.7
  require_multi_source: true

# Risk management
risk:
  max_position_per_market_usd: 25  # Max $25 per trade
  max_position_pct: 0.25  # Max 25% of capital per trade
  max_portfolio_exposure_usd: 500
  max_daily_trades: 20
  stop_loss_pct: 0.25
  balance_allocation_pct: 1.0  # 100% for Python module (use --allocation flag to change)

# Logging
logging:
  level: "INFO"
  file: "logs/bot.log"
